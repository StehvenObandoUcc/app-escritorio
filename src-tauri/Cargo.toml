[package]
name = "pulso"
version = "0.1.0"
description = "Pulso: tiempo, tareas y uso de IA de tu equipo"
authors = ["Equipo Pulso"]
license = ""
repository = "https://github.com/StehvenObandoUcc/app-escritorio"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pulso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
